spring.application.name=fishmarket

# MySQL connection properties
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/fishstore
spring.datasource.username=root
spring.datasource.password=root

# Log JPA queries
spring.jpa.show-sql=true

# Обмеження розміру на виключно один конкретний файл (значення за замовчуванням 1MB)
#spring.servlet.multipart.max-file-size=10MB

# Обмеження розміру на весь запит (значення за замовчуванням 10MB)
#spring.servlet.multipart.max-request-size=50MB

# Flyway config
spring.flyway.enabled=true
spring.flyway.locations=classpath:sql/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Drop and create new tables (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=none
