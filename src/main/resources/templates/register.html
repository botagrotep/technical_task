<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #f4f7fc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .register-container {
            background: white;
            padding: 30px;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .input-group {
            margin-bottom: 15px;
            position: relative;
        }

        .input-group label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: #4CAF50;
            outline: none;
        }

        .register-button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .register-button:hover {
            background-color: #45a049;
        }

        .error-message {
            color: red;
            font-size: 14px;
            text-align: center;
            margin-bottom: 15px;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }

        .footer a {
            color: #4CAF50;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="register-container">
    <h2>Реєстрація</h2>
    <form th:action="@{/fish/register}" th:object="${users}" method="post">
        <div class="input-group">
            <p th:if="${#fields.hasErrors('login')}"
               th:errorclass="text-danger" th:errors="${users.login}"></p>
            <p th:if="${#fields.hasErrors('password')}"
               th:errorclass="text-danger" th:errors="${users.password}"></p>
            <p th:if="${#fields.hasErrors('confirmPassword')}"
               th:errorclass="text-danger" th:errors="${users.confirmPassword}"></p>
            <label for="login">Логін</label>
            <input id="login" type="text" th:field="*{login}" placeholder="Введіть логін"/>

        </div>

        <div class="input-group">
            <label for="password">Пароль</label>
            <input id="password" type="password" th:field="*{password}" placeholder="Введіть пароль"/>

        </div>

        <div class="input-group">
            <label for="confirmPassword">Підтвердіть пароль</label>
            <input id="confirmPassword" type="password" th:field="*{confirmPassword}" placeholder="Повторіть пароль"/>

        </div>

        <button type="submit" class="register-button">Зареєструватися</button>
    </form>

    <div class="footer">
        <p>Вже маєш акаунт? <a href="/fish/login">Увійти</a></p>
    </div>
</div>

</body>
</html>
