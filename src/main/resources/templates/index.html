<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Best fish</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    .image-container {
      position: relative;
      display: inline-block;
    }

    .image-container img {
      transition: transform 0.3s ease;
      width: 100px;
    }

    .image-container:hover img {
      transform: scale(4);
      z-index: 10;
      position: relative;
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container-fluid">
      <span class="navbar-brand">🐟 Fish Market</span>
      <div class="navbar-nav ms-auto">
        <div sec:authorize="isAuthenticated()">
              <span class="navbar-text me-3">
                Привіт, <span sec:authentication="name"></span>
                (<span sec:authentication="principal.authorities"></span>)
              </span>
          <a class="btn btn-outline-secondary btn-sm" href="/logout">Вийти</a>
        </div>
        <div sec:authorize="!isAuthenticated()">
          <a class="btn btn-outline-primary btn-sm" href="/login">Увійти</a>
        </div>
      </div>
    </div>
  </nav>

  <h1 class="text-center my-4">Рибка на продаж</h1>

  <!-- Admin-only button -->
  <div sec:authorize="hasRole('ADMIN')" class="mb-3">
    <a class="btn btn-success" href="/fish/create">Додати рибки</a>
  </div>

  <table class="table">
    <thead>
    <tr>
      <th>#</th>
      <th>Товар</th>
      <th>Ціна</th>
      <th>Дата вилову</th>
      <th>Фото</th>
      <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="fish : ${fishlist}">
      <td th:text="${fish.id}"></td>
      <td th:text="${fish.name}"></td>
      <td th:text="${fish.price} + '₴'"></td>
      <td th:text="${fish.catchDate.toString().substring(0,10)}"></td>
      <td>
        <div th:each="imageFileName : ${fish.imageFileNames}" class="image-container" style="margin-right: 5px;">
          <img th:src="@{'/images/' + ${imageFileName}}" alt="Fish image" width="100">
        </div>
      </td>
      <td>
        <!-- Admin-only delete button -->
        <div sec:authorize="hasRole('ADMIN')">
          <a class="btn btn-danger btn-sm" th:href="@{/fish/delete(id=${fish.id})}" onclick="return confirm('Ви впевнені?')">Прибрати</a>
        </div>
      </td>
    </tr>
    </tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
