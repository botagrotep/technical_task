<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Best fish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <style>
        .image-container {
            position: relative;
            display: inline-block;
            margin: 3px;
        }

        .image-container img {
            transition: transform 0.3s ease;
            width: 100px;
            border-radius: 8px;
        }

        .image-container:hover img {
            transform: scale(3.5);
            z-index: 10;
            position: relative;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="text-center my-4">Рибка на продаж</h1>

    <a class="btn btn-success mb-3" href="/fish/create">Додати рибку</a>

    <table class="table table-bordered align-middle">
        <thead class="table-light">
        <tr>
            <th>#</th>
            <th>Назва</th>
            <th>Ціна</th>
            <th>Дата вилову</th>
            <th>Фото</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="fish : ${fishlist}">
            <td th:text="${fish.id}"></td>
            <td th:text="${fish.name}"></td>
            <td th:text="${fish.price} + ' ₴'"></td>
            <td th:text="${#dates.format(fish.catchDate, 'yyyy-MM-dd')}"></td>
            <td>
                <div th:if="${fish.images != null}">
                    <div th:each="img : ${fish.images}" class="image-container">
                        <img th:src="@{'/images/' + ${img.imageFileName}}" alt="fish photo">
                    </div>
                </div>
            </td>
            <td>
                <a class="btn btn-danger btn-sm" th:href="@{/fish/delete(id=${fish.id})}"
                   onclick="return confirm('Ви впевнені?')">Прибрати</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
