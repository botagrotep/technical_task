<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Best fish</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            crossorigin="anonymous">
</head>
<body>

<div class="container">
    <div class="row">
        <div class="col-md-8 mx-auto rounded border p-4 m-4">
            <h2 class="text-center mb-5">Нова рибка</h2>

            <form method="post" enctype="multipart/form-data"
                  th:object="${fishDto}" th:action="@{/fish/create}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <!-- Назва -->
                <div class="row mb-3">
                    <label class="col-sm-4 col-form-label">Назва</label>
                    <div class="col-sm-8">
                        <input class="form-control" th:field="*{name}">
                        <p th:if="${#fields.hasErrors('name')}" class="text-danger" th:errors="*{name}"></p>
                    </div>
                </div>

                <!-- Ціна -->
                <div class="row mb-3">
                    <label class="col-sm-4 col-form-label">Ціна, ₴</label>
                    <div class="col-sm-8">
                        <input class="form-control" type="number" step="0.01" min="0" th:field="*{price}">
                        <p th:if="${#fields.hasErrors('price')}" class="text-danger" th:errors="*{price}"></p>
                    </div>
                </div>

                <!-- Фото -->
                <div class="row mb-3">
                    <label class="col-sm-4 col-form-label">Фото</label>
                    <div class="col-sm-8">
                        <input class="form-control" type="file" th:field="*{imageFiles}" multiple>
                        <p th:if="${#fields.hasErrors('imageFiles')}" class="text-danger" th:errors="*{imageFiles}"></p>
                        <small class="text-muted">Можна вибрати кілька фото</small>
                    </div>
                </div>

                <!-- Кнопки -->
                <div class="row mb-3">
                    <div class="offset-sm-4 col-sm-4 d-grid">
                        <button type="submit" class="btn btn-primary">Створити</button>
                    </div>
                    <div class="col-sm-4 d-grid">
                        <button type="button" class="btn btn-outline-primary"
                                onclick="window.location.href='/fish'">Скасувати</button>
                    </div>
                </div>

            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
