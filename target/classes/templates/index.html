<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Best fish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
      .image-container {
          position: relative;
          display: inline-block;
      }

      .image-container img {
          transition: transform 0.3s ease;
          width: 100px;
      }

      .image-container:hover img {
          transform: scale(4);
          z-index: 10;
          position: relative;
      }
    </style>
  </head>
  <body>
  <div class="d-flex justify-content-end p-3">
    <div id="auth-buttons"></div>
  </div>
  <div class="container">
      <h1 class="text-center my-4">Рибка на продаж</h1>
      <a class="btn btn-success" href="/fish/create" sec:authorize="hasRole('ROLE_ADMIN')">Додати рибки</a>
      <table class="table">
        <thead>
          <tr>
            <th>#</th>
            <th>Товар</th>
            <th>Ціна</th>
            <th>Дата вилову</th>
            <th>Фото</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="fish : ${fishlist}">
            <td th:text="${fish.id}"></td>
            <td th:text="${fish.name}"></td>
            <td th:text="${fish.price} + '₴'"></td>
            <td th:text="${fish.catchDate.toString().substring(0,10)}"></td>
            <td>
              <div th:each="img : ${fish.images}" class="image-container">
                <img th:src="@{'/images/'+${img.fileName}}" alt="..." width="100">
              </div>
            </td>
            <td>
              <a class="btn btn-danger btn-sm" th:href="@{/fish/delete(id=${fish.id})}" onclick="return confirm('Ви впевнені?')" sec:authorize="hasRole('ROLE_ADMIN')">Прибрати</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

<script th:inline="javascript">
  document.addEventListener("DOMContentLoaded", function () {
    // Отримуємо дані автентифікації від Thymeleaf
    const authName = /*[[${#authentication?.name}]]*/ 'anonymousUser';
    const authAuthorities = /*[[${#authentication?.authorities}]]*/ null;
    const isAuthenticated = authName !== 'anonymousUser' && authAuthorities !== null;

    // Отримуємо login і role з flash-атрибутів (після логіну)
    const flashLogin = /*[[${login}]]*/ null;
    const flashRole = /*[[${role}]]*/ null;

    // Зберігаємо flash-атрибути в localStorage, якщо вони є
    if (flashLogin && flashRole && flashLogin !== 'null' && flashRole !== 'null') {
      localStorage.setItem("auth_login", flashLogin);
      localStorage.setItem("auth_role", flashRole);
    }

    // Використовуємо серверні дані для відображення, якщо користувач автентифікований
    let displayLogin = isAuthenticated ? authName : localStorage.getItem("auth_login");
    let displayRole = isAuthenticated ? authAuthorities.toString().replace(/[\[\]]/g, '') : localStorage.getItem("auth_role");

    // Оновлюємо кнопки авторизації
    const container = document.getElementById("auth-buttons");
    if (isAuthenticated && displayLogin && displayRole) {
      container.innerHTML = `
                <span class="me-3">Вітаю, <strong>${displayLogin}</strong>!</span>
                <form action="/fish/logout" method="post" style="display: inline;">
                    <button class="btn btn-outline-danger btn-sm" type="submit">Вихід</button>
                </form>
            `;
    } else {
      container.innerHTML = `
                <a href="/fish/login" class="btn btn-outline-primary btn-sm me-2">Вхід</a>
                <a href="/fish/register" class="btn btn-outline-secondary btn-sm">Реєстрація</a>
            `;
    }
  });

  // Логаут більше не потрібен у JavaScript, оскільки форма POST обробляється сервером
</script>
