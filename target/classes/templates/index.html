<!doctype html>
<html lang="uk"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
	<div class="container-fluid">
		<a class="navbar-brand" href="/">Best Fish</a>

		<div class="collapse navbar-collapse justify-content-end">
			<ul class="navbar-nav">
				<!-- Если пользователь не авторизован -->
				<li class="nav-item" sec:authorize="isAnonymous()"><a
					class="nav-link" th:href="@{/login}">Login</a></li>

				<!-- Если пользователь авторизован -->
				<li class="nav-item dropdown" sec:authorize="isAuthenticated()">
					<a class="nav-link dropdown-toggle" href="#" role="button"
					data-bs-toggle="dropdown"> <span sec:authentication="name"></span>
						<!-- username -->
				</a>
					<ul class="dropdown-menu dropdown-menu-end">
						<li>
							<form th:action="@{/logout}" method="post" style="margin: 0;">
								<button type="submit" class="dropdown-item">Logout</button>
							</form>
						</li>
					</ul>
				</li>
			</ul>
		</div>
	</div>
</nav>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">
<style>
.image-container {
	position: relative;
	display: inline-block;
}

.image-container img {
	transition: transform 0.3s ease;
	width: 100px;
}

.image-container:hover img {
	transform: scale(4);
	z-index: 10;
	position: relative;
}

.btn-group-sm .btn {
	margin-right: 5px;
}
</style>
</head>
<body>
	<div class="container">
		<h1 class="text-center my-4">Рибка на продаж</h1>

		<a class="btn btn-success mb-3" href="/fish/create"
			sec:authorize="hasRole('ADMIN')">Додати рибку</a>

		<table class="table table-striped align-middle">
			<thead>
				<tr>
					<th>#</th>
					<th>Товар</th>
					<th>Ціна</th>
					<th>Дата вилову</th>
					<th>Фото</th>
					<th class="text-center">Дії</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="fish : ${fishlist}">
					<td th:text="${fish.id}"></td>
					<td th:text="${fish.name}"></td>
					<td th:text="${fish.price} + ' ₴'"></td>
					<td th:text="${fish.catchDate.toString().substring(0,10)}"></td>
					<td>
						<div class="image-container">
							<img th:src="@{'/images/' + ${fish.imageFileName}}" alt="Фото"
								width="100">
						</div>
					</td>
					<td class="text-center">
						<div class="btn-group btn-group-sm">
							<!-- 🔹 Переглянути всі фото -->
							<a class="btn btn-info"
								th:href="@{/fish/images/{id}(id=${fish.id})}"> Переглянути </a>

							<!-- 🔹 Редагувати товар -->
							<a class="btn btn-primary"
								th:href="@{/fish/edit/{id}(id=${fish.id})}"
								sec:authorize="hasRole('ADMIN')"> Редагувати </a>

							<!-- 🔹 Прибрати товар -->
							<a class="btn btn-danger"
								th:href="@{/fish/delete(id=${fish.id})}"
								onclick="return confirm('Ви впевнені, що хочете видалити цей товар?')"
								sec:authorize="hasRole('ADMIN')"> Прибрати </a>
						</div>
					</td>
				</tr>
			</tbody>
		</table>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
</body>
</html>
