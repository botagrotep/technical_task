<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Фото рибки</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .image-container {
      position: relative;
      display: inline-block;
      margin: 5px;
    }

    .image-container img {
      transition: transform 0.3s ease;
      width: 150px;
      cursor: pointer;
    }

    .image-container:hover img {
      transform: scale(3);
      z-index: 10;
      position: relative;
    }
  </style>
</head>
<body>
<div class="container mt-4">
  <h2 th:text="'Фото для ' + ${fish.name}"></h2>

  <div class="mt-4">
    <h4>Фото:</h4>
    <div class="d-flex flex-wrap gap-2">
      <div th:each="img : ${images}" class="image-container">
        <img th:src="@{'/images/' + ${img.fileName}}" alt="Фото рибки">
      </div>
    </div>
  </div>
</div>
</body>
</html>
