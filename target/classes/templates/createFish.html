<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Best fish</title>
	<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
			crossorigin="anonymous">
	<style>
		.image-preview {
			max-width: 150px;
			max-height: 150px;
			object-fit: cover;
			border-radius: 8px;
		}
		.preview-container {
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			margin-top: 10px;
		}
		.preview-item {
			position: relative;
			display: inline-block;
		}
		.preview-item .remove-btn {
			position: absolute;
			top: -8px;
			right: -8px;
			background: #dc3545;
			color: white;
			border: none;
			border-radius: 50%;
			width: 24px;
			height: 24px;
			font-size: 12px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
		}
	</style>
</head>
<body>

<div class="container">
	<div class="row">
		<div class="col-md-8 mx-auto rounded border p-4 m-4">
			<h2 class="text-center mb-5">Нова рибка</h2>
			<form method="post" enctype="multipart/form-data" th:object="${fishDto}">

				<div class="row mb-3">
					<label class="col-sm-4 col-form-label">Назва</label>
					<div class="col-sm-8">
						<input class="form-control" th:field="*{name}">
						<p th:if="${#fields.hasErrors('name')}"
						   class="text-danger" th:errors="*{name}"></p>
					</div>
				</div>

				<div class="row mb-3">
					<label class="col-sm-4 col-form-label">Ціна, ₴</label>
					<div class="col-sm-8">
						<input class="form-control" type="number" step="0.01" min="0"
							   th:field="*{price}">
						<p th:if="${#fields.hasErrors('price')}"
						   class="text-danger" th:errors="*{price}"></p>
					</div>
				</div>

				<div class="row mb-3">
					<label class="col-sm-4 col-form-label">Фото</label>
					<div class="col-sm-8">
						<!-- Use name attribute for multiple file upload -->
						<input class="form-control" type="file" multiple accept="image/*"
							   name="imageFiles" id="imageFiles">
						<p th:if="${#fields.hasErrors('imageFiles')}"
						   class="text-danger" th:errors="*{imageFiles}"></p>
						<small class="form-text text-muted">
							Можна вибрати кілька зображень (JPG, PNG, GIF)
						</small>

						<!-- Image preview container -->
						<div id="previewContainer" class="preview-container"></div>
					</div>
				</div>

				<div class="row mb-3">
					<div class="offset-sm-4 col-sm-4 d-grid">
						<button type="submit" class="btn btn-primary">Створити</button>
					</div>
					<div class="col-sm-4 d-grid">
						<button type="button" class="btn btn-outline-primary"
								onclick="window.location.href='/fish'">Скасувати</button>
					</div>
				</div>
			</form>
		</div>
	</div>
</div>

<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>

<script>
	let selectedFiles = [];

	document.getElementById('imageFiles').addEventListener('change', function(event) {
		const files = Array.from(event.target.files);
		const previewContainer = document.getElementById('previewContainer');

		// Add new files to selectedFiles array
		files.forEach(file => {
			if (file.type.startsWith('image/')) {
				selectedFiles.push(file);
			}
		});

		// Clear and rebuild preview
		updatePreview();
	});

	function updatePreview() {
		const previewContainer = document.getElementById('previewContainer');
		previewContainer.innerHTML = '';

		selectedFiles.forEach((file, index) => {
			const reader = new FileReader();
			reader.onload = function(e) {
				const previewItem = document.createElement('div');
				previewItem.className = 'preview-item';
				previewItem.innerHTML = `
          <img src="${e.target.result}" class="image-preview" alt="Preview">
          <button type="button" class="remove-btn" onclick="removeImage(${index})" title="Видалити">
            ×
          </button>
          <div class="text-center small mt-1">${file.name}</div>
        `;
				previewContainer.appendChild(previewItem);
			};
			reader.readAsDataURL(file);
		});

		// Update the file input with current selection
		updateFileInput();
	}

	function removeImage(index) {
		selectedFiles.splice(index, 1);
		updatePreview();
	}

	function updateFileInput() {
		const fileInput = document.getElementById('imageFiles');
		const dataTransfer = new DataTransfer();

		selectedFiles.forEach(file => {
			dataTransfer.items.add(file);
		});

		fileInput.files = dataTransfer.files;
	}

	// Handle drag and drop
	const fileInput = document.getElementById('imageFiles');
	const fileInputContainer = fileInput.parentElement;

	['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
		fileInputContainer.addEventListener(eventName, preventDefaults, false);
	});

	function preventDefaults(e) {
		e.preventDefault();
		e.stopPropagation();
	}

	['dragenter', 'dragover'].forEach(eventName => {
		fileInputContainer.addEventListener(eventName, highlight, false);
	});

	['dragleave', 'drop'].forEach(eventName => {
		fileInputContainer.addEventListener(eventName, unhighlight, false);
	});

	function highlight(e) {
		fileInputContainer.classList.add('border-primary');
	}

	function unhighlight(e) {
		fileInputContainer.classList.remove('border-primary');
	}

	fileInputContainer.addEventListener('drop', handleDrop, false);

	function handleDrop(e) {
		const dt = e.dataTransfer;
		const files = Array.from(dt.files);

		files.forEach(file => {
			if (file.type.startsWith('image/')) {
				selectedFiles.push(file);
			}
		});

		updatePreview();
	}
</script>
</body>
</html>
