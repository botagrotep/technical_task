<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Редагування рибки</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .image-container {
      display: inline-block;
      position: relative;
      margin: 8px;
    }
    
    .image-container img {
      width: 150px;
      border-radius: 4px;
      cursor: pointer;
    }
  
    .delete-checkbox {
      position: absolute;
      top: 5px;
      left: 5px;
      transform: scale(1.4);
    }
  </style>
</head>

<body>
<div class="container mt-4">
  <h2 th:text="'Редагування ' + ${fish.name}"></h2>

  <form th:action="@{/fish/edit}" method="post" enctype="multipart/form-data">
    <input type="hidden" name="id" th:value="${fish.id}">

    <div class="mb-3">
      <label class="form-label">Назва</label>
      <input type="text" name="name" class="form-control" th:value="${fish.name}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Ціна, ₴</label>
      <input type="number" name="price" class="form-control" step="0.01" th:value="${fish.price}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Додати фото</label>
      <input type="file" name="images" multiple class="form-control">
    </div>

    <div class="mb-3">
      <h5>Існуючі фото: Постав галочку для видалення.</h5>

      <div th:each="img : ${images}" class="image-container">

        <!-- чекбокс удаления -->
        <input type="checkbox"
               class="delete-checkbox"
               name="imagesToDelete"
               th:value="${img.id}">

        <img th:src="@{'/images/' + ${img.fileName}}">
      </div>
    </div>

    <button type="submit" class="btn btn-primary">Зберегти</button>
    <a th:href="@{/fish}" class="btn btn-outline-secondary">Скасувати</a>
  </form>
</div>
</body>
</html>
